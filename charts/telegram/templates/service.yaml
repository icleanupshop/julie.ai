apiVersion: v1
kind: Service
metadata:
  name: {{ include "telegram.fullname" . }}
  labels:
    {{- include "telegram.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http