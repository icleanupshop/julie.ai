apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telegram.fullname" . }}
  labels:
    {{- include "telegram.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telegram
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/julie-telegram"]
          args: ["-config", "/etc/julie-telegram/config.json", "-state-db", "/var/lib/julie-telegram/state.db", "-listen", ":{{ .Values.service.port }}"]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "telegram.credentialsSecret is required" .Values.telegram.credentialsSecret }}
                  key: {{ .Values.telegram.botTokenKey }}
            - name: TELEGRAM_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "mcp.credentialsSecret is required" .Values.mcp.credentialsSecret }}
                  key: {{ .Values.mcp.tokenKey }}
            - name: JULIE_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "embeddings.existingSecret is required" .Values.embeddings.existingSecret }}
                  key: {{ .Values.embeddings.apiKeyKey }}
                  optional: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/julie-telegram
              readOnly: true
            - name: state
              mountPath: /var/lib/julie-telegram
      volumes:
        - name: config
          configMap:
            name: {{ include "telegram.fullname" . }}-config
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "telegram.fullname" . }}-state