{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "SQLite-backed sessions require replicaCount=1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "julie.fullname" . }}
  labels:
    {{- include "julie.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "julie.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "julie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: julie
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-listen"
            - ":8080"
            - "-config"
            - "/etc/julie/model.json"
            - "-workspace"
            - "/workspace"
            - "-sessions-db"
            - "/var/lib/julie/sessions.db"
            {{- if .Values.soul.existingConfigMap }}
            - "-soul-file"
            - "/run/julie-soul/soul.md"
            {{- end }}
            - "-max-steps"
            - {{ .Values.agent.maxSteps | quote }}
            - "-timeout"
            - {{ .Values.agent.timeout | quote }}
            {{- if and (not .Values.workspace.toolsEnabled) (not .Values.mcp.enabled) }}
            - "-no-tools"
            {{- end }}
          env:
            - name: JULIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "credentials.existingSecret is required" .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.apiKeyKey }}
            - name: JULIE_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.embeddingApiKeyKey }}
                  optional: true
            {{- if .Values.mcp.enabled }}
            - name: JULIE_MCP_URL
              value: "http://{{ include "julie.fullname" . }}-mcp:{{ .Values.mcp.port }}/mcp"
            - name: JULIE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "mcp.existingSecret is required when MCP is enabled" .Values.mcp.existingSecret }}
                  key: {{ .Values.mcp.tokenKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-config
              mountPath: /etc/julie
              readOnly: true
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: sessions
              mountPath: /var/lib/julie
            {{- if .Values.soul.existingConfigMap }}
            - name: soul
              mountPath: /run/julie-soul
              readOnly: true
            {{- end }}
      volumes:
        - name: model-config
          configMap:
            name: {{ include "julie.fullname" . }}-config
        {{- if .Values.soul.existingConfigMap }}
        - name: soul
          configMap:
            name: {{ .Values.soul.existingConfigMap | quote }}
            items:
              - key: {{ .Values.soul.key | quote }}
                path: soul.md
        {{- end }}
        - name: workspace
          {{- if .Values.workspace.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.existingClaim }}
            readOnly: true
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: sessions
          persistentVolumeClaim:
            claimName: {{ .Values.sessions.existingClaim | default (printf "%s-sessions" (include "julie.fullname" .)) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}